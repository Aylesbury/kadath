name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [all, postgres, mysql]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> ghcr.io/<repo>:all / :postgres / :mysql (+ :latest for all)
      # v1.2.3 -> ghcr.io/<repo>:all-1.2.3 / :postgres-1.2.3 / :mysql-1.2.3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.engine }},enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.engine == 'all' }}
            type=semver,pattern=${{ matrix.engine }}-{{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ENGINE=${{ matrix.engine }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
